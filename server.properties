# LBCore server config.
# This file is optional — if it's missing, or a key below is missing,
# the server falls back to built-in defaults and still starts.
#
# Any hosting target (home PC, Playit.gg/ngrok tunnel, Oracle/AWS/GCP
# VPS) works with bind-address left at 0.0.0.0 — that already means
# "accept connections from LAN, localhost, and the public internet at
# once." Only change it if you deliberately want to restrict access
# (e.g. 127.0.0.1 to block everything but local connections).

port=19132
bind-address=0.0.0.0
motd=LBCore Bedrock Server
level-name=Test World
gamemode=Survival
max-players=10
protocol-version=2168
version-name=26.45
